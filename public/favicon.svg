<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Timeminer: a block whose face is a clock.
       Hands are asymmetric (long minute hand up, short hour hand left) because
       equal-length hands read as the letter L at 40px. The 9:00 pose keeps the
       dial legible down to a 16px favicon, where diagonal hands blur into a
       checkmark. The hands are knocked out with a mask instead of drawn on top,
       so the silhouette survives scaling and the mark needs one colour.
       Flat by design: no gradients, no glow. -->
  <defs>
    <mask id="tm-hands">
      <rect width="64" height="64" fill="#fff"/>
      <g stroke="#000" stroke-width="4" stroke-linecap="round">
        <path d="M32 32V20.5"/>
        <path d="M32 32H21"/>
      </g>
      <circle cx="32" cy="32" r="2.9" fill="#000"/>
    </mask>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0C0F15"/>
  <!-- The knocked-out hands reveal this plate. Without it the cut-outs would
       show the browser's tab background, which is not ours to control. -->
  <path d="M32 11L50.19 21.5V42.5L32 53L13.81 42.5V21.5L32 11Z" fill="#0C0F15"/>
  <path
    d="M32 11L50.19 21.5V42.5L32 53L13.81 42.5V21.5L32 11Z"
    fill="#6EA2F7"
    mask="url(#tm-hands)"/>
</svg>
