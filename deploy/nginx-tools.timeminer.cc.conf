# nginx vhost for tools.timeminer.cc
#
# Mirrors the layout already used by swap.timeminer.cc on this host: HTTPS with
# Certbot certificates, traffic pinned to 127.0.0.1, and the Cloudflare origin
# lockdown shared through /etc/nginx/conf.d/cf-ips.conf.
#
# The frontend and the four exchange-rate relays run in the Docker container
# described by docker-compose.yml. nginx routes each /api/ prefix to its relay.

server {
    server_name tools.timeminer.cc;

    client_max_body_size 8m;

    # Visa and Mastercard relays call slow upstreams; give them room.
    proxy_connect_timeout 15s;
    proxy_read_timeout 180s;

    # ── API relays ────────────────────────────────────────────────────────────
    location /api/unionpay {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/sources {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full Google/Sina/XE sweep is paced; individual calls can be slow.
        proxy_read_timeout 300s;
    }

    location /api/visa {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/mastercard {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Daily snapshot produced by the timer; the frontend reads it on load.
    location /api/snapshot {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static bundle ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tools.timeminer.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tools.timeminer.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # ── Origin lockdown ──────────────────────────────────────────────────────
    # $cf_trusted comes from /etc/nginx/conf.d/cf-ips.conf. Anything that is not
    # a Cloudflare edge address is rejected, so the origin IP cannot be used to
    # bypass the CDN.
    if ($cf_trusted = 0) {
        return 403;
    }
}

server {
    if ($host = tools.timeminer.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name tools.timeminer.cc;
    return 404; # managed by Certbot
}
