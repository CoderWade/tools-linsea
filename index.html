<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve the stored theme before first paint, otherwise the dark default
         flashes light for users who picked dark. Keep this tiny and synchronous.
         The legacy key is read too, so the rename does not reset the theme. -->
    <script>
      try {
        var raw = localStorage.getItem("timeminer-react-state") || localStorage.getItem("linsea-react-state");
        var saved = JSON.parse(raw || "{}");
        if (saved.theme !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Timeminer Tools: a privacy-first toolbox for Web3 security, developers, commerce operations, and risk testing."
    />
    <!-- theme-color follows the palette so mobile browser chrome matches the app. -->
    <meta name="theme-color" content="#0C0F15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)" />
    <!--
      Icon links carry a version query. Browsers cache favicons far more
      aggressively than pages (Chrome can keep one for a whole session and,
      on a revisit, reuse it without revalidating), so an unversioned
      href keeps showing the previous mark after a rebrand. Bump ?v= whenever
      any of these files changes.

      The PNG entries come first on purpose: Safari — including iOS — does not
      render SVG favicons, and it needs a raster apple-touch-icon to avoid
      downscaling a square screenshot onto the home screen.
    -->
    <link rel="icon" href="./favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-16.png?v=2" sizes="16x16" type="image/png" />
    <link rel="icon" href="./favicon.svg?v=2" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon-180.png?v=2" sizes="180x180" />
    <title>Timeminer Tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
